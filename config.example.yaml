# JARVIS Configuration File
# Голосовой ассистент для CachyOS + Hyprland

# === АУДИО ===
audio:
  # Микрофон (Fifine K669 USB)
  microphone:
    device_name: ""  # Часть имени микрофона (пусто = системный по умолчанию)
    sample_rate: 48000

  # Динамики
  output:
    device_name: null  # null = системный дефолт
    sample_rate: 48000

# === РАСПОЗНАВАНИЕ РЕЧИ (STT) ===
stt:
  engine: "whisper"  # vosk | whisper
  sample_rate: 16000

  # Vosk (лёгкий, быстрый, для команд)
  vosk:
    model_path: "auto"  # auto = поиск в models/, ~/.local/share/vosk
    # sample_rate наследуется из stt.sample_rate

  # Whisper (точный, но тяжелее, для диалогов)
  whisper:
    model_path: null  # путь к локальной модели (null = автозагрузка model_size из HuggingFace)
    model_size: "tiny"  # tiny | base | small | medium | large (используется если model_path=null)
    partial_interval_ms: 1000  # промежуточные гипотезы каждые N мс (0 = выключить)
    # Чем больше модель, тем выше точность и больше RAM:
    #   tiny  ~1GB  RAM  ~2x realtime
    #   base  ~1.5GB RAM  ~1x realtime
    #   small ~3GB   RAM  ~0.5x realtime
    initial_prompt: "Разговор с голосовым ассистентом по имени Джарвис."

  # Wake word detection
  wake_word: "джарвис"
  wake_word_alternatives:
    - "жарвис"
    - "жавис"
    - "джавис"
    - "жарве"
    - "жарись"
    - "джарри"
    - "джервис"
    - "jarvis"
    - "жар весь"
    - "жар из"
    - "жар вис"
    - "жар-вис"
    - "жаркость"
    - "жарвиз"
    - "джарвиз"
    - "джарвес"
    - "дарвис"
    - "ярвис"

  # Таймауты
  phrase_time_limit: 10  # секунд
  silence_threshold: null  # секунд тишины = конец фразы; null = дефолт движка (vosk 2.0, whisper 1.0)
  multi_turn_timeout: 10  # секунд ожидания продолжения разговора (после ответа)
  wake_mode: "classic"   # classic | vad — метод детекции wake word

# === ДЕТЕКЦИЯ ГОЛОСА (VAD) ===
vad:
  enabled: true
  engine: "silero"  # silero | webrtc

  silero:
    model_path: "auto"  # auto = поиск в models/, ~/.local/share/silero
    threshold: 0.5        # 0.0-1.0, чем выше = строже

# === СИНТЕЗ РЕЧИ (TTS) ===
tts:
  engine: "piper"  # piper | gtts | speecht5

  piper:
    binary_path: "$HOME/.local/bin/piper"
    model_path: "$HOME/models/piper/ru_RU-dmitri-medium.onnx"
    config_path: "auto"
    lib_path: "/usr/share/steam/compatibilitytools.d/proton-ge-custom/files/lib/x86_64-linux-gnu"  # Только для Arch/CachyOS
    speaker_id: 0
    length_scale: 1.0  # скорость (1.0 = норма, <1 = быстрее, >1 = медленнее)

  # Fallback на gTTS если Piper не работает
  gtts:
    lang: "ru"
    slow: false

  # SpeechT5 — голос Джарвиса из фильма (локальная копия)
  speecht5:
    model: "$HOME/models/jarvis-tts/speecht5_tts_jarvis"
    vocoder_path: "$HOME/models/jarvis-tts/hifigan"
    device: "cpu"  # cpu | cuda (GTX 1050 несовместима с текущим PyTorch)
    speaker_id: 0

# === ЯЗЫКОВАЯ МОДЕЛЬ (LLM) ===
llm:
  provider: "ollama"  # ollama | openai | anthropic | openrouter

  # Bash-агент (tools): без этого флага LLM отвечает текстом, не вызывая команды
  agent_enabled: true
  agent_approval_mode: "auto"  # auto | strict | yolo

  # Ollama (локально, по умолчанию)
  ollama:
    base_url: "http://localhost:11434"
    model: "qwen2.5:3b"
    temperature: 0.7

  # OpenAI (нативный API) — нужен OPENAI_API_KEY в окружении
  openai:
    api_key: "${OPENAI_API_KEY}"
    # base_url: null  # не задан → api.openai.com
    model: "gpt-4o-mini"
    temperature: 0.7
    max_tokens: 1024
    timeout: 30

  # Anthropic (нативный API) — нужен ANTHROPIC_API_KEY в окружении
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-3-5-sonnet-20241022"
    temperature: 0.7
    max_tokens: 1024
    timeout: 30

  # OpenRouter (OpenAI-compatible aggregator) — нужен OPENROUTER_API_KEY
  openrouter:
    api_key: "${OPENROUTER_API_KEY}"
    model: "anthropic/claude-3.5-sonnet"
    temperature: 0.7

  # Bash-агент loop: когда unmatched запрос падает в LLM, провайдер
  # с поддержкой tool-calling (ollama/openai/anthropic) может вызывать
  # bash/read/write tools. См. jarvis.response_pipeline.
  agent_max_iterations: 5   # предел итераций tool-loop

  # История диалога
  max_history: 20

  # System prompt
  system_prompt: |
    Ты — JARVIS, персональный ИИ-ассистент, инженер и эксперт по Linux и разработке ПО ({platform}).
    Сейчас: {datetime}.

    Тон и стиль:
    - Отвечай кратко, прямо и строго по существу задачи (1-3 предложения или одним словом).
    - Без лишних вводных фраз («Конечно!», «Рад помочь») и без повторения вопроса.
    - Без эмодзи. Формулируй фразы естественно для удобного восприятия на слух через TTS.

    Профессиональная объективность:
    - Техническая точность и факты превыше ложной вежливости.
    - Объективно указывай на ошибки и предлагай лучшие решения. Не выдумывай факты.

    Инструменты и Bash:
    - Для фактов о системе и действий используй инструменты (bash/read/write), а не догадки.
    - При выполнении нетривиальных команд кратко поясняй их назначение.
    - Безопасные и неразрушающие действия в приоритете. Опасные операции требуют подтверждения.

    Код и разработка:
    - Соблюдай стиль и соглашения проекта, не добавляй комментариев без просьбы.
    - Не создавай новые файлы, если задачу можно решить редактированием существующих.
    - Никогда не выводи и не сохраняй секреты и API-ключи.

# === КОМАНДЫ ===
commands:
  # Локальный словарь команд (обрабатываются БЕЗ LLM)
  dictionary_path: "data/commands.json"  # Используй commands_base.json для минимальной версии
  apps_dictionary_path: "data/apps.json"

  # Fuzzy matching для команд
  fuzzy_threshold: 0.8  # 0.0-1.0, чем выше = строже

  # Таймаут выполнения команды
  execution_timeout: 30

# === ЛОГИРОВАНИЕ ===
logging:
  level: "INFO"  # DEBUG | INFO | WARNING | ERROR
  file: "logs/jarvis.log"
  max_size: 10485760  # 10MB
  backup_count: 5

# === TELEGRAM-БОТ (опционально) ===
# Удалённый доступ к JARVIS из мессенджера. Токен выдаёт @BotFather.
# pip install -e ".[telegram]"
# telegram:
#   enabled: true
#   bot_token: "123456:ABC-DEF..."  # или TELEGRAM_BOT_TOKEN в .env
#   allowed_chat_ids: [123456789]   # fail-closed: пусто = никто

# === РАЗНОЕ ===
misc:
  # Временные файлы
  temp_dir: "/tmp/jarvis"
