name: Test JARVIS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  docker-linux:
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, debian, fedora]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Build and test on ${{ matrix.distro }}
        run: |
          for i in $(seq 1 3); do \
            docker buildx build \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --load \
              -t jarvis-test:${{ matrix.distro }} \
              -f docker/Dockerfile.${{ matrix.distro }} \
              . && break; \
            echo "Build attempt $i failed, retrying in $((i * 5))s..."; \
            [ "$i" = 3 ] && exit 1; \
            sleep $((i * 5)); \
          done
          docker run --rm jarvis-test:${{ matrix.distro }}

  docker-integration:
    strategy:
      fail-fast: false
      matrix:
        de: [i3, sway]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Build and test on ${{ matrix.de }}
        run: |
          for i in $(seq 1 3); do \
            docker buildx build \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --load \
              --target integration \
              -t jarvis-integration:${{ matrix.de }} \
              -f docker/Dockerfile.${{ matrix.de }} \
              . && break; \
            echo "Build attempt $i failed, retrying in $((i * 5))s..."; \
            [ "$i" = 3 ] && exit 1; \
            sleep $((i * 5)); \
          done
          docker run --rm \
            ${{ matrix.de == 'sway' && '--privileged' || '--cap-add=SYS_PTRACE --cap-add=SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined' }} \
            jarvis-integration:${{ matrix.de }}

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          brew install portaudio || true
      - name: Install Python dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install --retries 5 --timeout 120 -e ".[dev]"
      - name: Debug info
        run: |
          echo "Python: $(python3 --version)"
          echo "Pip: $(python3 -m pip --version)"
          python3 -c "import sys; print(f'Arch: {sys.platform}')"
      - name: Run tests
        run: |
          source venv/bin/activate
          # pipefail обязателен: без него код возврата pytest съедает tail
          # и джоба зелёная при любых падениях тестов.
          set -o pipefail
          python -m pytest tests/ -v -x --tb=long -m "not slow and not integration" 2>&1 | tail -100
