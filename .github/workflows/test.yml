name: Test JARVIS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  docker-linux:
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, debian, fedora]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test on ${{ matrix.distro }}
        run: |
          docker build \
            -t jarvis-test:${{ matrix.distro }} \
            -f docker/Dockerfile.${{ matrix.distro }} \
            .
          docker run --rm jarvis-test:${{ matrix.distro }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          source venv/bin/activate
          python -m pytest tests/ -v -m "not slow"
