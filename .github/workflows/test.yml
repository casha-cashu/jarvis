name: Test JARVIS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  docker-linux:
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, debian, fedora]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and test on ${{ matrix.distro }}
        run: |
          docker build \
            -t jarvis-test:${{ matrix.distro }} \
            -f docker/Dockerfile.${{ matrix.distro }} \
            .
          docker run --rm jarvis-test:${{ matrix.distro }}

  docker-integration:
    strategy:
      fail-fast: false
      matrix:
        de: [i3, sway]
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.de == 'sway' }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and test on ${{ matrix.de }}
        run: |
          docker build \
            --target integration \
            -t jarvis-integration:${{ matrix.de }} \
            -f docker/Dockerfile.${{ matrix.de }} \
            .
          docker run --rm \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            jarvis-integration:${{ matrix.de }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: brew install portaudio || true
      - name: Install Python dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          source venv/bin/activate
          python -m pytest tests/ -v -m "not slow"
