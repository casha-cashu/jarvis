name: Release JARVIS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 2.6.2)"
        required: false

jobs:
  build-portable:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install system deps (webkit, gtk, rpm, fuse)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            rpm fuse libfuse2 \
            python3 python3-pip python3-venv

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis-ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python deps + PyInstaller sidecar
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          # Рантайм-зависимости sidecar: без них PyInstaller только
          # предупредит о пропущенных импортах, а бинарь упадёт на
          # первом import requests/anthropic/pydantic.
          # CPU-torch: иначе PyPI тянет CUDA-бандл (~3-5GB), который
          # spec всё равно исключает из sidecar
          venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          venv/bin/pip install -e .
          venv/bin/pip install pyinstaller
          # slim sidecar (no torch) — same as local jarvis-bridge.spec
          venv/bin/pyinstaller jarvis-bridge.spec --workpath /tmp/pyi-build --distpath /tmp/pyi-dist --noconfirm
          mkdir -p jarvis-ui/src-tauri/binaries
          cp /tmp/pyi-dist/jarvis-bridge jarvis-ui/src-tauri/binaries/jarvis-bridge-x86_64-unknown-linux-gnu
          chmod +x jarvis-ui/src-tauri/binaries/jarvis-bridge-x86_64-unknown-linux-gnu
          ls -lh jarvis-ui/src-tauri/binaries/

      - name: Build frontend + Tauri bundles (deb, rpm, appimage)
        working-directory: jarvis-ui
        run: |
          npm ci
          npm run build
          npx tauri build --bundles deb,rpm,appimage
          ls -lh src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Build Arch pkg (repack deb) — skip on ubuntu
        run: |
          echo "arch pkg repack skipped on ubuntu — use local dist/arch/jarvis-*.pkg.tar.zst (needs arch host / makepkg)"
          ls -lh dist/arch/*.pkg.tar.zst 2>&1 | head || echo "no local pkg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: jarvis-portable-${{ github.ref_name }}
          path: |
            jarvis-ui/src-tauri/target/release/bundle/deb/*.deb
            jarvis-ui/src-tauri/target/release/bundle/rpm/*.rpm
            jarvis-ui/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Check glibc
        run: |
          echo "host glibc $(ldd --version | head -1)"
          echo "app glibc needs $(strings jarvis-ui/src-tauri/target/release/jarvis | grep -m1 GLIBC_ | head) "
          ldd jarvis-ui/src-tauri/target/release/jarvis | head -20

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis-ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps + PyInstaller sidecar (macOS)
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          # Рантайм-зависимости sidecar — см. комментарий в build-portable
          venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          venv/bin/pip install -e .
          venv/bin/pip install pyinstaller
          venv/bin/pyinstaller jarvis-bridge.spec --workpath /tmp/pyi-build --distpath /tmp/pyi-dist --noconfirm
          mkdir -p jarvis-ui/src-tauri/binaries
          cp /tmp/pyi-dist/jarvis-bridge jarvis-ui/src-tauri/binaries/jarvis-bridge-aarch64-apple-darwin || cp /tmp/pyi-dist/jarvis-bridge jarvis-ui/src-tauri/binaries/jarvis-bridge-x86_64-apple-darwin || cp /tmp/pyi-dist/jarvis-bridge jarvis-ui/src-tauri/binaries/jarvis-bridge
          chmod +x jarvis-ui/src-tauri/binaries/jarvis-bridge*
          ls -lh jarvis-ui/src-tauri/binaries/

      - name: Build frontend + Tauri dmg
        working-directory: jarvis-ui
        run: |
          npm ci
          npm run build
          npx tauri build --bundles dmg
          ls -lh src-tauri/target/release/bundle/dmg/*.dmg src-tauri/target/release/bundle/macos/*.app 2>&1 | head -20

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: jarvis-macos-${{ github.ref_name }}
          path: |
            jarvis-ui/src-tauri/target/release/bundle/dmg/*.dmg
            jarvis-ui/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 14

  build-macos-intel:
    # macos-13 — последний Intel (x86_64) раннер; dmg для старых Mac
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis-ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps + PyInstaller sidecar (macOS Intel)
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          venv/bin/pip install -e .
          venv/bin/pip install pyinstaller
          venv/bin/pyinstaller jarvis-bridge.spec --workpath /tmp/pyi-build --distpath /tmp/pyi-dist --noconfirm
          mkdir -p jarvis-ui/src-tauri/binaries
          cp /tmp/pyi-dist/jarvis-bridge jarvis-ui/src-tauri/binaries/jarvis-bridge-x86_64-apple-darwin
          chmod +x jarvis-ui/src-tauri/binaries/jarvis-bridge*
          ls -lh jarvis-ui/src-tauri/binaries/

      - name: Build frontend + Tauri dmg (Intel)
        working-directory: jarvis-ui
        run: |
          npm ci
          npm run build
          npx tauri build --bundles dmg
          ls -lh src-tauri/target/release/bundle/dmg/*.dmg src-tauri/target/release/bundle/macos/*.app 2>&1 | head -20

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v6
        with:
          name: jarvis-macos-intel-${{ github.ref_name }}
          path: |
            jarvis-ui/src-tauri/target/release/bundle/dmg/*.dmg
            jarvis-ui/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    # Автосоздание GitHub Release с прикреплёнными пакетами
    needs: [build-portable, build-macos, build-macos-intel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: jarvis-sbom-${{ github.ref_name }}.spdx.json
          artifact-name: jarvis-sbom-${{ github.ref_name }}.spdx.json

      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          find artifacts -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" \) \
            -exec gh release upload "${GITHUB_REF_NAME}" {} +
          gh release upload "${GITHUB_REF_NAME}" "jarvis-sbom-${GITHUB_REF_NAME}.spdx.json"
