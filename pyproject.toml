[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-voice-assistant"
version = "2.0.0"
description = "JARVIS — голосовой ассистент для Linux и macOS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["voice-assistant", "speech-recognition", "jarvis", "linux", "hyprland"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Desktop Environment",
]

dependencies = [
    "pyyaml>=6.0",
    "vosk>=0.3.45",
    "pyaudio>=0.2.14",
    "numpy>=1.24",
    "anthropic>=0.30",
    "requests>=2.30",
    "gtts>=2.5",
    "audioop-lts>=0.2",
]

[project.urls]
Homepage = "https://github.com/yourusername/jarvis-universal"
Source = "https://github.com/yourusername/jarvis-universal"
BugTracker = "https://github.com/yourusername/jarvis-universal/issues"

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["modules/**/*", "adapters/**/*"]
