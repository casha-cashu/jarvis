[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-voice-assistant"
version = "2.9.0"
description = "JARVIS — голосовой ассистент для Linux и macOS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["voice-assistant", "speech-recognition", "jarvis", "linux", "hyprland"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Desktop Environment",
]

# Pinned to known-good versions (repo venv, 1260 pytest green).
# Чистая установка ставит это, а не newest. torch — осознанно диапазон
# (CUDA у разработчиков vs CPU в docker). Бампить после полного гейта.
dependencies = [
    "pyyaml==6.0.3",
    "pyaudio==0.2.14",
    "numpy==2.4.6",
    "torch>=2.0",
    "faster-whisper==1.2.1",
    "silero-vad==6.2.1",
    "scikit-learn==1.9.0",
    "joblib==1.5.3",
    "anthropic==0.104.1",
    "openai==2.46.0",
    "requests==2.34.2",
    "gtts==2.5.4",
    "pydantic==2.13.4",
    "filelock==3.29.0",
    "ruamel.yaml==0.19.1",
    "rapidfuzz==3.14.5",
    "audioop-lts==0.2.2; python_version >= '3.13'",
]

[project.urls]
Homepage = "https://github.com/casha-cashu/jarvis"
Source = "https://github.com/casha-cashu/jarvis"
BugTracker = "https://github.com/casha-cashu/jarvis/issues"

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[project.optional-dependencies]
# vosk опционален: wheels есть только для Python 3.10-3.12, на 3.13+
# установка провалится. Движок STT переключается на whisper (stt.engine).
# Ставится так: pip install -e ".[vosk]"
vosk = ["vosk==0.3.45"]
telegram = ["aiogram==3.31.0"]
dev = ["pytest==9.0.3", "pytest-cov==7.1.0", "pytest-mock==3.15.1", "pytest-timeout>=2.1", "pre-commit>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow tests (network, model download, etc.)",
    "integration: integration tests that need a real DE/WM",
    "i3: tests specific to i3",
    "sway: tests specific to Sway",
    "x11: tests that need X11 display",
    "wayland: tests that need Wayland display",
    "ollama: integration tests that need a running local Ollama server",
    "llm: tests that exercise real LLM providers",
]

[tool.mypy]
# Соответствует pre-commit (mirrors-mypy с --ignore-missing-imports).
# Сторонние библиотеки без py.typed (vosk, sklearn, joblib, gtts,
# faster-whisper, silero-vad, pyaudio, soundfile) не анализируются.
ignore_missing_imports = true
# Бинарники-бинари проверяем с дефолтной строгостью; исключения —
# чужой для проверки код не включаем (venv/tests проверяются вручную).
files = ["jarvis"]

[tool.setuptools.package-data]
jarvis = ["modules/**/*", "adapters/**/*"]
